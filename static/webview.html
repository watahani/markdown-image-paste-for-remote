<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src %%CSP_SOURCE%%; script-src 'nonce-%%NONCE%%';" />
    <title>Paste Image</title>
    <link href="%%STYLE_SOURCE%%" rel="stylesheet">
</head>

<body>
    <main class="card">
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="M21 15l-5-5L5 21" />
            </svg>
        </div>
        <h1>Paste an image from your clipboard</h1>
        <p class="hint">
            Click the button below, or press <kbd id="shortcut">Ctrl+V</kbd>.<br>
            The image will be saved to the remote host and linked in your Markdown file.
        </p>

        <button id="paste-button" type="button" autofocus>Paste Image</button>

        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <details class="log">
        <summary>Debug log</summary>
        <pre id="log"></pre>
    </details>

    <script src="%%SCRIPT_SOURCE%%" nonce="%%NONCE%%"></script>
</body>

</html>
